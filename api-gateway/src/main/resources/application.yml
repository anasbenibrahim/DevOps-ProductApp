server:
  port: ${SERVER_PORT:5000}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:5001}
          predicates: [Path=/api/products/**]
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:5002}
          predicates: [Path=/api/orders/**]
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:5003}
          predicates: [Path=/api/users/**]
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:5004}
          predicates: [Path=/api/reports/**]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
