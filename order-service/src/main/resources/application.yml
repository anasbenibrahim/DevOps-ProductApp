server:
  port: ${SERVER_PORT:5002}
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orders
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
# Propriete lue par ProductClient (@Value("${product-service.url}"))
product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:5001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
